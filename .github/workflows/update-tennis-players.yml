name: Update Tennis Players

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select first 4 players
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          players = []
          seen = set()

          for tour in ("atp", "wta"):
              path = Path(f"data/{tour}-today.json")

              if not path.exists():
                  continue

              payload = json.loads(path.read_text())

              for match in payload.get("data", []):
                  for side in ("player1", "player2"):
                      player = match.get(side) or {}
                      pid = player.get("id")

                      if pid is None:
                          continue

                      key = f"{tour}:{pid}"

                      if key in seen:
                          continue

                      seen.add(key)

                      players.append({
                          "id": str(pid),
                          "name": player.get("name", ""),
                          "tour": tour
                      })

                      if len(players) >= 4:
                          break

                  if len(players) >= 4:
                      break

              if len(players) >= 4:
                  break

          Path("players-to-fetch.json").write_text(
              json.dumps(players, indent=2)
          )

          print("PLAYERS SELECTED:")
          for p in players:
              print(p["tour"], p["id"], p["name"])

          print("Total selected:", len(players))
          PY

      - name: Fetch player profiles and 2026 stats
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: |
          mkdir -p player-temp

          python3 - <<'PY' > player-list.txt
          import json

          players = json.load(open("players-to-fetch.json"))

          for p in players:
              safe_name = p["name"].replace("|", " ")
              print(f'{p["tour"]}|{p["id"]}|{safe_name}')
          PY

          while IFS='|' read -r TOUR PLAYER_ID PLAYER_NAME
          do
            echo "----------------------------------------"
            echo "Collecting: $TOUR $PLAYER_NAME ($PLAYER_ID)"

            PROFILE_FILE="player-temp/${TOUR}-${PLAYER_ID}-profile.json"
            STATS_FILE="player-temp/${TOUR}-${PLAYER_ID}-stats.json"

            PROFILE_CODE=$(curl \
              --silent \
              --show-error \
              --output "$PROFILE_FILE" \
              --write-out "%{http_code}" \
              --get \
              --url "https://api.sportsapi365.com/v1/tennis/${TOUR}/player/profile/${PLAYER_ID}" \
              --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
              --data-urlencode "include=form,ranking,country")

            echo "Profile HTTP: $PROFILE_CODE"

            if [ "$PROFILE_CODE" != "200" ]; then
              echo "PROFILE FAILED for $PLAYER_NAME"
              cat "$PROFILE_FILE" || true
              rm -f "$PROFILE_FILE"
              continue
            fi

            STATS_CODE=$(curl \
              --silent \
              --show-error \
              --output "$STATS_FILE" \
              --write-out "%{http_code}" \
              --get \
              --url "https://api.sportsapi365.com/v1/tennis/profile/${PLAYER_ID}/match-stat/2026" \
              --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
              --data-urlencode "type=${TOUR}" \
              --data-urlencode "includeAll=true")

            echo "2026 Stats HTTP: $STATS_CODE"

            if [ "$STATS_CODE" != "200" ]; then
              echo "STATS FAILED for $PLAYER_NAME"
              cat "$STATS_FILE" || true
              rm -f "$PROFILE_FILE" "$STATS_FILE"
              continue
            fi

            echo "SUCCESS: $PLAYER_NAME"

          done < player-list.txt

      - name: Build player cache
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          cache_path = Path("data/player-cache.json")

          try:
              cache = json.loads(cache_path.read_text())
              if not isinstance(cache, dict):
                  cache = {}
          except Exception:
              cache = {}

          players = json.load(open("players-to-fetch.json"))

          saved = 0

          for player in players:
              tour = player["tour"]
              pid = player["id"]

              profile_path = Path(
                  f"player-temp/{tour}-{pid}-profile.json"
              )

              stats_path = Path(
                  f"player-temp/{tour}-{pid}-stats.json"
              )

              if not profile_path.exists() or not stats_path.exists():
                  print("Not cached:", player["name"])
                  continue

              try:
                  profile_raw = json.loads(profile_path.read_text())
                  stats_raw = json.loads(stats_path.read_text())
              except Exception as error:
                  print("JSON error:", player["name"], error)
                  continue

              key = f"{tour}:{pid}"

              cache[key] = {
                  "id": pid,
                  "name": player["name"],
                  "tour": tour.upper(),
                  "profile": profile_raw.get("data", profile_raw),
                  "season2026": stats_raw.get("data", stats_raw),
                  "updatedAt": datetime.now(timezone.utc).isoformat()
              }

              saved += 1
              print("Cached:", key, player["name"])

          cache_path.parent.mkdir(parents=True, exist_ok=True)

          cache_path.write_text(
              json.dumps(
                  cache,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print("--------------------------------")
          print("Players saved this run:", saved)
          print("Total players in cache:", len(cache))
          PY

      - name: Commit player cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/player-cache.json

          if git diff --cached --quiet; then
            echo "No player cache changes."
          else
            git commit -m "Update tennis player cache"
            git push
          fi
