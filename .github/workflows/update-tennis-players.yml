
name: Update Tennis Players

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tennis-player-cache
  cancel-in-progress: false

jobs:
  collect-players:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select uncached players
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          cache_path = Path("data/player-cache.json")

          try:
              cache = json.loads(cache_path.read_text())
              if not isinstance(cache, dict):
                  cache = {}
          except Exception:
              cache = {}

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=24)

          players = []
          seen = set()

          for tour in ("atp", "wta"):
              path = Path(f"data/{tour}-today.json")
              if not path.exists():
                  continue

              payload = json.loads(path.read_text())

              for match in payload.get("data", []):
                  for side in ("player1", "player2"):
                      player = match.get(side) or {}
                      pid = player.get("id") or match.get(side + "Id")

                      if pid is None:
                          continue

                      key = f"{tour}:{pid}"

                      if key in seen:
                          continue
                      seen.add(key)

                      cached = cache.get(key)
                      if isinstance(cached, dict):
                          stamp = cached.get("updatedAt")
                          if stamp:
                              try:
                                  updated = datetime.fromisoformat(
                                      stamp.replace("Z", "+00:00")
                                  )
                                  if updated.tzinfo is None:
                                      updated = updated.replace(tzinfo=timezone.utc)
                                  if updated >= cutoff:
                                      continue
                              except ValueError:
                                  pass

                      players.append({
                          "id": str(pid),
                          "name": player.get("name", ""),
                          "tour": tour
                      })

                      if len(players) >= 12:
                          break

                  if len(players) >= 12:
                      break

              if len(players) >= 12:
                  break

          Path("players-to-fetch.json").write_text(
              json.dumps(players, indent=2)
          )

          print("Players selected:", len(players))
          for p in players:
              print(p["tour"], p["id"], p["name"])
          PY

      - name: Fetch player profiles and 2026 stats
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: |
          mkdir -p player-temp

          python3 - <<'PY' > player-list.txt
          import json

          for p in json.load(open("players-to-fetch.json")):
              print(
                  f'{p["tour"]}|{p["id"]}|'
                  f'{p["name"].replace("|", " ")}'
              )
          PY

          while IFS='|' read -r TOUR PLAYER_ID PLAYER_NAME
          do
            echo "Collecting: $TOUR $PLAYER_NAME"

            PROFILE_FILE="player-temp/${TOUR}-${PLAYER_ID}-profile.json"
            STATS_FILE="player-temp/${TOUR}-${PLAYER_ID}-stats.json"

            PROFILE_CODE=$(curl \
              --silent --show-error \
              --output "$PROFILE_FILE" \
              --write-out "%{http_code}" \
              --get \
              --url "https://api.sportsapi365.com/v1/tennis/${TOUR}/player/profile/${PLAYER_ID}" \
              --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
              --data-urlencode "include=form,ranking,country") || PROFILE_CODE="000"

            echo "Profile HTTP: $PROFILE_CODE"

            if [ "$PROFILE_CODE" != "200" ]; then
              echo "PROFILE FAILED: $PLAYER_NAME"
              rm -f "$PROFILE_FILE"
              continue
            fi

            STATS_CODE=$(curl \
              --silent --show-error \
              --output "$STATS_FILE" \
              --write-out "%{http_code}" \
              --get \
              --url "https://api.sportsapi365.com/v1/tennis/profile/${PLAYER_ID}/match-stat/2026" \
              --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
              --data-urlencode "type=${TOUR}" \
              --data-urlencode "includeAll=true") || STATS_CODE="000"

            echo "2026 Stats HTTP: $STATS_CODE"

            if [ "$STATS_CODE" != "200" ]; then
              echo "STATS FAILED: $PLAYER_NAME"
              rm -f "$PROFILE_FILE" "$STATS_FILE"
              continue
            fi

            echo "SUCCESS: $PLAYER_NAME"

          done < player-list.txt

      - name: Build player cache
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          path = Path("data/player-cache.json")

          try:
              cache = json.loads(path.read_text())
              if not isinstance(cache, dict):
                  cache = {}
          except Exception:
              cache = {}

          players = json.load(open("players-to-fetch.json"))
          saved = 0

          for player in players:
              tour = player["tour"]
              pid = player["id"]

              profile_path = Path(
                  f"player-temp/{tour}-{pid}-profile.json"
              )
              stats_path = Path(
                  f"player-temp/{tour}-{pid}-stats.json"
              )

              if not profile_path.exists() or not stats_path.exists():
                  continue

              try:
                  profile = json.loads(profile_path.read_text())
                  stats = json.loads(stats_path.read_text())

                  profile_data = profile.get("data", profile)
                  stats_data = stats.get("data", stats)

                  if not isinstance(profile_data, dict):
                      raise ValueError("Invalid profile payload")
                  if not isinstance(stats_data, dict):
                      raise ValueError("Invalid stats payload")

                  cache[f"{tour}:{pid}"] = {
                      "id": pid,
                      "name": player["name"],
                      "tour": tour.upper(),
                      "profile": profile_data,
                      "season2026": stats_data,
                      "updatedAt": datetime.now(
                          timezone.utc
                      ).isoformat()
                  }

                  saved += 1
                  print("Cached:", player["name"])

              except Exception as error:
                  print("Invalid data:", player["name"], error)

          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(cache, indent=2, ensure_ascii=False)
          )

          print("--------------------------------")
          print("Players selected:", len(players))
          print("Players saved this run:", saved)
          print("Total players in cache:", len(cache))

          if players and saved == 0:
              raise SystemExit(
                  "No players collected. Check API responses and limits."
              )
          PY

      - name: Commit player cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/player-cache.json

          if git diff --cached --quiet; then
            echo "No cache changes."
          else
            git commit -m "Expand tennis player cache"
            git push
          fi
