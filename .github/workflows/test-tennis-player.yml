name: Test Tennis Player

on:
  workflow_dispatch:

jobs:
  test-player:
    runs-on: ubuntu-latest

    steps:
      - name: Test Frances Tiafoe player profile
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: |
          echo "Testing SportsAPI365 player profile..."

          curl --fail --silent --show-error \
            --get \
            --url "https://api.sportsapi365.com/v1/tennis/atp/player/profile/29939" \
            --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
            --data-urlencode "include=form,ranking,country" \
            --output tiafoe-test.json

          echo ""
          echo "PLAYER RESPONSE:"
          echo "--------------------------------"
          cat tiafoe-test.json
          echo ""
          echo "--------------------------------"
