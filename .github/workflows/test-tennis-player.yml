name: Test Tennis Player Stats

on:
  workflow_dispatch:

jobs:
  test-player-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Test Frances Tiafoe match stats
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: |
          echo "Getting Frances Tiafoe match stats..."

          curl --fail --silent --show-error \
            --request GET \
            --url "https://api.sportsapi365.com/v1/tennis/atp/player/match-stats/29939" \
            --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
            --output tiafoe-stats.json

          echo ""
          echo "MATCH STATS RESPONSE:"
          echo "--------------------------------"
          cat tiafoe-stats.json
          echo ""
          echo "--------------------------------"
