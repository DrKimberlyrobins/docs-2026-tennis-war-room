name: Update Tennis Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-tennis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull today's ATP and WTA fixtures
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: |
          mkdir -p data

          echo "Getting ATP matches..."

          curl --fail --silent --show-error \
            --get \
            --url "https://api.sportsapi365.com/v1/tennis/atp/fixtures" \
            --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
            --data-urlencode "filter=PlayerGroup:singles" \
            --data-urlencode "include=round,tournament" \
            --data-urlencode "pageSize=100" \
            --data-urlencode "pageNo=1" \
            --output data/atp-today.json

          echo "Getting WTA matches..."

          curl --fail --silent --show-error \
            --get \
            --url "https://api.sportsapi365.com/v1/tennis/wta/fixtures" \
            --header "X-Gravitee-Api-Key: $TENNIS_API_KEY" \
            --data-urlencode "filter=PlayerGroup:singles" \
            --data-urlencode "include=round,tournament" \
            --data-urlencode "pageSize=100" \
            --data-urlencode "pageNo=1" \
            --output data/wta-today.json

          echo ""
          echo "ATP response preview:"
          head -c 500 data/atp-today.json

          echo ""
          echo ""
          echo "WTA response preview:"
          head -c 500 data/wta-today.json

          echo ""

      - name: Commit updated tennis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/atp-today.json data/wta-today.json

          if git diff --cached --quiet; then
            echo "No tennis data changes."
          else
            git commit -m "Update tennis data"
            git push
          fi
