name: Update Tennis Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write

jobs:
  update-tennis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull today's ATP and WTA fixtures
        env:
          TENNIS_API_KEY: ${{ secrets.TENNIS_API_KEY }}
        run: |
          mkdir -p data

          curl --fail --silent --show-error \
            --request GET \
            --url "https://tennis-api-atp-wta-itf.p.rapidapi.com/tennis/v2/atp/fixtures?pageSize=100&pageNo=1" \
            --header "X-RapidAPI-Key: $TENNIS_API_KEY" \
            --header "X-RapidAPI-Host: tennis-api-atp-wta-itf.p.rapidapi.com" \
            --output data/atp-today.json

          curl --fail --silent --show-error \
            --request GET \
            --url "https://tennis-api-atp-wta-itf.p.rapidapi.com/tennis/v2/wta/fixtures?pageSize=100&pageNo=1" \
            --header "X-RapidAPI-Key: $TENNIS_API_KEY" \
            --header "X-RapidAPI-Host: tennis-api-atp-wta-itf.p.rapidapi.com" \
            --output data/wta-today.json

          echo "ATP response:"
          head -c 500 data/atp-today.json
          echo ""
          echo "WTA response:"
          head -c 500 data/wta-today.json
          echo ""

      - name: Commit updated tennis data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/atp-today.json data/wta-today.json

          if git diff --cached --quiet; then
            echo "No tennis data changes."
          else
            git commit -m "Update tennis data"
            git push
          fi
